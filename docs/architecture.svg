<text x="135.0" y="318" text-anchor="middle" font-weight="700" font-size="14.0" fill="#111827">Step Functions</text>
<text x="135.0" y="336" text-anchor="middle" font-size="11.5" fill="#374151">IncidentWorkflow</text>
<text x="135.0" y="351" text-anchor="middle" font-size="11.5" fill="#374151">create case, then investigate</text>
<rect x="40" y="400" width="190" height="60" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6" />
