<text x="40" y="38" font-size="24" font-weight="800" fill="#111827">CloudOps Guardian: conversational incident response over email (Amazon SES + Bedrock AgentCore)</text>
<text x="40" y="60" font-size="13" fill="#4b5563">An agent investigates an EC2 incident with governed read-only tools, then holds the conversation with the operator by email until the fix is approved, executed and verified.</text>
<text x="40" y="86" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b7280">DETECT</text>
<text x="330" y="86" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b7280">ORCHESTRATE</text>
<text x="700" y="86" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b7280">INVESTIGATE (read-only)</text>
<text x="1060" y="86" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b7280">ACT (governed write)</text>
<rect x="40" y="100" width="190" height="60" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.6" />
<text x="135.0" y="122" text-anchor="middle" font-weight="700" font-size="14.0" fill="#111827">CloudWatch Alarm</text>
