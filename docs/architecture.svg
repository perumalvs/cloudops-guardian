<rect x="330" y="250" width="260" height="330" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6" />
<text x="460.0" y="272" text-anchor="middle" font-weight="700" font-size="14.0" fill="#111827">Orchestrator (Lambda)</text>
<text x="345" y="310" font-size="11.5" fill="#374151">Case state machine (14 states)</text>
<text x="345" y="332" font-size="11.5" fill="#374151">Plan builder: immutable, parameter-hashed</text>
<text x="345" y="354" font-size="11.5" fill="#374151">Approval validator: sender allow-list,</text>
<text x="345" y="376" font-size="11.5" fill="#374151">  single-use token, SES auth verdicts</text>
<text x="345" y="398" font-size="11.5" fill="#374151">Execute-once claim (idempotent)</text>
<text x="345" y="420" font-size="11.5" fill="#374151">Pre-action re-check of live state</text>
<text x="345" y="442" font-size="11.5" fill="#374151">Audit trail with secret redaction</text>
<text x="345" y="464" font-size="11.5" fill="#374151">Kill switch: EXECUTION_ENABLED</text>
